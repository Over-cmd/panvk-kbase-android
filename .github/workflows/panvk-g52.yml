name: PanVK Driver Mali-G52

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  # Versión del paquete; también se muestra como el nombre del controlador en DXVK HUD / MangoHud.
  PANVK_RELEASE: "1.1.5-FC"

jobs:
  build-panvk-android:
    name: Build PanVK G52 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [adrenotools, x11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          LLVM_VER="$(llvm-config --version 2>/dev/null | cut -d. -f1 || true)"
          if [ -z "$LLVM_VER" ] && command -v llvm-config-22 >/dev/null 2>&1; then
            LLVM_VER="22"
          fi
          LLVM_VER="${LLVM_VER:-22}"
          echo "Usando paquetes LLVM versión: ${LLVM_VER}"

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            git \
            zip \
            unzip \
            "llvm-${LLVM_VER}-dev" \
            "libclang-${LLVM_VER}-dev" \
            "libclc-${LLVM_VER}-dev" \
            "libllvmspirvlib-${LLVM_VER}-dev" \
            libelf-dev \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

          if ! pkg-config --exists SPIRV-Tools 2>/dev/null && ! pkg-config --exists SPIRV-Tools-shared 2>/dev/null; then
            echo "Compilando SPIRV-Tools + SPIRV-Headers desde fuente para /usr/local..."
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git /tmp/spirv-tools
            cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local
            cmake --build /tmp/spirv-headers/build
            sudo cmake --build /tmp/spirv-headers/build --target install
            cmake -S /tmp/spirv-tools -B /tmp/spirv-tools/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSPIRV-Headers_SOURCE_DIR=/tmp/spirv-headers \
              -DSPIRV_WERROR=OFF \
              -DBUILD_SHARED_LIBS=ON \
              -DSPIRV_SKIP_TESTS=ON
            cmake --build /tmp/spirv-tools/build
            sudo cmake --build /tmp/spirv-tools/build --target install
            sudo ldconfig
            rm -rf /tmp/spirv-headers /tmp/spirv-tools
          fi

      - name: Verify sources.lock
        run: |
          python3 -c "import json; d=json.load(open('sources.lock')); assert len(d['mesaCommit'])==40, d"

      - name: Fetch pinned Mesa
        run: ./scripts/fetch-mesa.sh

      - name: Apply PanVK G52 patches
        # Ajusta el perfil según los nombres soportados por ./scripts/apply-patches.sh en tu repo (ej. g52-v7-jm o bifrost)
        run: ./scripts/apply-patches.sh --profile g52-v7-jm

      - name: Stamp driver version
        # driverInfo (DXVK HUD, MangoHud, vulkaninfo) muestra esta versión.
        run: |
          set -euo pipefail
          vulkan_dir="work/mesa/src/panfrost/vulkan"
          if [ ! -d "$vulkan_dir" ]; then
            echo "ERROR: No existe el directorio $vulkan_dir"
            exit 1
          fi

          f="$vulkan_dir/panvk_vX_physical_device.c"
          if [ ! -f "$f" ]; then
            echo "Aviso: no existe $f; buscando archivos physical_device en $vulkan_dir..."
            ls -la "$vulkan_dir"
            f="$(find "$vulkan_dir" -maxdepth 1 -name '*physical_device*.c' | head -n1)"
          fi

          if [ -z "${f:-}" ] || [ ! -f "$f" ]; then
            echo "ERROR: No se encontró un archivo physical_device en $vulkan_dir"
            exit 1
          fi

          echo "Usando archivo: $f"
          grep -nE "PANVK_KBASE_RELEASE|PanVK-kbase|driverInfo|panvk" "$f" | head -n 30 || true

          if grep -qE "^#define PANVK_KBASE_RELEASE " "$f"; then
            sed -i "s/^#define PANVK_KBASE_RELEASE \".*\"/#define PANVK_KBASE_RELEASE \"${PANVK_RELEASE}\"/" "$f"
            grep -q "^#define PANVK_KBASE_RELEASE \"${PANVK_RELEASE}\"" "$f"
          else
            echo "Aviso: no se encontró '#define PANVK_KBASE_RELEASE' en $f"
          fi

          if grep -q '"PanVK-kbase " PANVK_KBASE_RELEASE' "$f"; then
            sed -i 's/"PanVK-kbase " PANVK_KBASE_RELEASE/"PanVK G52 " PANVK_KBASE_RELEASE/' "$f"
            grep -q '"PanVK G52 " PANVK_KBASE_RELEASE' "$f"
          else
            echo "Aviso: no se encontró '\"PanVK-kbase \" PANVK_KBASE_RELEASE' en $f"
          fi

      - name: Build host tools
        run: |
          meson setup build-host work/mesa \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Meson for PanVK G52
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          fi
          export CLANG_LIB_DIR="${CLANG_DIR:-$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux/aarch64}"
          echo "CLANG_LIB_DIR=$CLANG_LIB_DIR"
          envsubst < android.toml > android-cross.txt
          cat android-cross.txt
          PLATFORMS="android"
          if [ "${{ matrix.flavor }}" = "x11" ]; then
            PLATFORMS="android,x11"
          fi
          meson setup build work/mesa \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=$PLATFORMS \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase

      - name: Build PanVK driver
        run: |
          meson compile -C build

      - name: Package driver
        run: |
          set -euo pipefail
          chmod +x ./scripts/package-release-zip.sh
          ./scripts/package-release-zip.sh --flavor "${{ matrix.flavor }}" --version "${PANVK_RELEASE}"

          zip_path="PanVK-G52-${PANVK_RELEASE}-${{ matrix.flavor }}.zip"
          ZIP_PATH="$zip_path" python3 - <<'EOF'
          import os
          import zipfile

          zp = os.environ["ZIP_PATH"]
          assert os.path.isfile(zp), f"No existe {zp}"
          with zipfile.ZipFile(zp, "r") as zf:
              names = zf.namelist()
              print("==> Contenido del ZIP:", names)
              assert "meta.json" in names, "Falta meta.json en la raíz del ZIP"
              assert "libvulkan_panfrost.so" in names, "Falta libvulkan_panfrost.so en la raíz del ZIP"
          EOF

      - name: Upload packaged ZIP driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G52-${{ matrix.flavor }}-release
          path: |
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}.zip
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}-MANIFEST.txt
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload raw driver binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-g52-aarch64-${{ matrix.flavor }}
          path: build/src/panfrost/vulkan/libvulkan_panfrost.so
          if-no-files-found: error
