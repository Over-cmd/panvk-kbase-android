name: Build PanVK Mali-G52

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Versión del paquete; también se muestra como el nombre del controlador en DXVK HUD / MangoHud.
  PANVK_RELEASE: "0.0.2-alpha-G52"
  MESA_REF: "mesa-26.3.0"

jobs:
  build-panvk-android:
    name: Build PanVK G52 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [adrenotools, x11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            cmake \
            ninja-build \
            llvm-21-dev \
            libclang-21-dev \
            libclc-21-dev \
            libllvmspirvlib-21-dev \
            libelf-dev \
            spirv-tools \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext

          SPIRV_PKGS=$(apt-cache search --names-only '^(lib)?spirv-(tools|headers)(-dev)?$' | awk '{print $1}' | tr '\n' ' ')
          echo "Paquetes SPIRV encontrados en apt: ${SPIRV_PKGS:-ninguno}"
          if [ -n "$SPIRV_PKGS" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $SPIRV_PKGS || true
          fi

          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Fetch Mesa 26.3.0
        run: |
          mkdir -p work/mesa
          curl -fSL --retry 5 --retry-delay 5 \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${MESA_REF}/mesa-${MESA_REF}.tar.gz" \
            | tar -xz --strip-components=1 -C work/mesa
          git -C work/mesa init -q
          git -C work/mesa config user.email "ci@local"
          git -C work/mesa config user.name "CI"
          git -C work/mesa add -A
          git -C work/mesa commit -q -m "Mesa ${MESA_REF}"

      - name: Apply PanVK G52 patches (best-effort + kbase/vk_android injection)
        run: |
          git -C work/mesa reset --hard HEAD
          git -C work/mesa clean -fd

          python3 - <<'PY'
          import glob
          import json
          import os
          import subprocess

          with open("profiles/g52-v7-jm.json", "r", encoding="utf-8") as f:
              prof = json.load(f)

          arch = prof["panArch"]
          frontend = prof["frontend"]
          series = ["common", "android", "kbase-common", "app-loader", "wsi"]
          if frontend == "CSF":
              series += ["csf", f"csf-v{arch}"]
          else:
              series += [f"jm-v{arch}"]

          ok_count = 0
          partial_count = 0

          for fam in series:
              files_dir = f"patches/{fam}/files"
              if os.path.isdir(files_dir):
                  print(f"COPY [{fam}] files/ -> work/mesa")
                  subprocess.run(
                      f"(cd {files_dir} && find . -type f ! -name README -print0 | tar --null -cf - -T -) | (cd work/mesa && tar -xf -)",
                      shell=True,
                      check=True,
                  )

              for p in sorted(glob.glob(f"patches/{fam}/*.patch")):
                  name = os.path.basename(p)
                  res = subprocess.run(
                      ["git", "-C", "work/mesa", "apply", "--recount", "--whitespace=nowarn", os.path.abspath(p)],
                      capture_output=True,
                      text=True,
                  )
                  if res.returncode == 0:
                      print(f"OK    [{fam}] {name}")
                      ok_count += 1
                  else:
                      res_rej = subprocess.run(
                          ["git", "-C", "work/mesa", "apply", "--reject", "--recount", "--whitespace=nowarn", os.path.abspath(p)],
                          capture_output=True,
                          text=True,
                      )
                      if res_rej.returncode == 0:
                          print(f"PART  [{fam}] {name} (aplicado con --reject)")
                          partial_count += 1
                      else:
                          print(f"DRIFT [{fam}] {name} (algunos hunks/archivos rechazados)")
                          partial_count += 1

          print(f"Resumen parches: ok={ok_count}, parciales/drift={partial_count}")
          PY

          python3 - <<'PY'
          import os
          import re

          meson_opts = "work/mesa/meson.options"
          if os.path.exists(meson_opts):
              with open(meson_opts, "r", encoding="utf-8", errors="replace") as f:
                  opts_content = f.read()
              if "'panfrost-kmds'" not in opts_content:
                  kmds_opt = (
                      "\noption(\n"
                      "  'panfrost-kmds',\n"
                      "  type : 'array',\n"
                      "  value : ['panthor'],\n"
                      "  choices : ['panthor', 'kbase'],\n"
                      "  description : 'KMDs to support in panfrost driver.'\n"
                      ")\n"
                  )
                  with open(meson_opts, "w", encoding="utf-8") as f:
                      f.write(opts_content + kmds_opt)
                  print("Añadida opción panfrost-kmds en meson.options")

          vk_hdr = "work/mesa/src/vulkan/runtime/vk_android.h"
          if os.path.exists(vk_hdr):
              with open(vk_hdr, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()
              decl = (
                  "VkResult vk_common_GetAndroidHardwareBufferPropertiesANDROID(\n"
                  "   VkDevice device_h, const struct AHardwareBuffer *buffer,\n"
                  "   VkAndroidHardwareBufferPropertiesANDROID *pProperties);\n"
              )
              if "vk_common_GetAndroidHardwareBufferPropertiesANDROID" not in content:
                  target = "vk_android_rp_attachment_has_external_format"
                  idx = content.find(target)
                  if idx != -1:
                      end_stmt = content.find(";", idx)
                      if end_stmt != -1:
                          content = content[: end_stmt + 1] + "\n\n" + decl + content[end_stmt + 1 :]
                      else:
                          content = content + "\n" + decl
                  else:
                      content = content + "\n" + decl
                  with open(vk_hdr, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Declaración añadida en src/vulkan/runtime/vk_android.h")

          kmod_meson = "work/mesa/src/panfrost/lib/kmod/meson.build"
          kbase_block = (
              "if meson.is_cross_build() and fs.exists('kbase_kmod.c')\n"
              "  libpankmod_lib_files += files('kbase_kmod.c')\n"
              "endif\n\n"
          )
          if os.path.exists(kmod_meson):
              with open(kmod_meson, "r", encoding="utf-8", errors="replace") as mf:
                  mcontent = mf.read()
              mcontent = re.sub(
                  r"if\s+(?:get_option\('panfrost-kmds'\)|panfrost_kmds)\.contains\('kbase'\)\s*\n\s*libpankmod_lib_files\s*\+=\s*files\('kbase_kmod\.c'\)\s*\nendif\s*\n*",
                  "",
                  mcontent,
              )
              if "fs.exists('kbase_kmod.c')" not in mcontent:
                  marker = "libpankmod_lib = static_library("
                  idx = mcontent.find(marker)
                  if idx != -1:
                      mcontent = mcontent[:idx] + kbase_block + mcontent[idx:]
                  else:
                      mcontent = mcontent + "\n" + kbase_block
              with open(kmod_meson, "w", encoding="utf-8") as mf:
                  mf.write(mcontent)
              print("Aplicado bloque condicional kbase_kmod.c en src/panfrost/lib/kmod/meson.build")

          pan_kmod_hdr = "work/mesa/src/panfrost/lib/kmod/pan_kmod.h"
          if os.path.exists(pan_kmod_hdr):
              with open(pan_kmod_hdr, "r", encoding="utf-8", errors="replace") as kh:
                  kcontent = kh.read()
              if "bo->dev->ops->bo_munmap" in kcontent:
                  if "#include <sys/mman.h>" not in kcontent:
                      kcontent = "#include <sys/mman.h>\n" + kcontent
                  kcontent = re.sub(
                      r"if\s*\(bo->dev->ops->bo_munmap\)\s*\n\s*return\s+bo->dev->ops->bo_munmap\(bo,\s*host_addr,\s*size\);\s*\n*",
                      "",
                      kcontent,
                  )
                  kcontent = re.sub(
                      r"return\s+munmap\(host_addr,\s*size\);",
                      "return munmap(host_addr, size);",
                      kcontent,
                  )
                  if "munmap(host_addr, size)" not in kcontent:
                      kcontent = re.sub(
                          r"(pan_kmod_bo_munmap\s*\([^)]*\)\s*\{)",
                          r"\1\n   return munmap(host_addr, size);",
                          kcontent,
                          count=1,
                      )
                  with open(pan_kmod_hdr, "w", encoding="utf-8") as kh:
                      kh.write(kcontent)
                  print("Parcheado pan_kmod_bo_munmap en src/panfrost/lib/kmod/pan_kmod.h para usar munmap")
          PY

      - name: Stamp driver version
        run: |
          f="work/mesa/src/panfrost/vulkan/panvk_vX_physical_device.c"
          if [ -f "$f" ]; then
            sed -i "s/^#define PANVK_KBASE_RELEASE \".*\"/#define PANVK_KBASE_RELEASE \"${PANVK_RELEASE}\"/" "$f"
            sed -i 's/"PanVK-kbase " PANVK_KBASE_RELEASE/"PanVK G52 " PANVK_KBASE_RELEASE/' "$f"
          fi

      - name: Build host tools
        run: |
          if [ -x /usr/bin/llvm-config-21 ]; then
            export LLVM_CONFIG=/usr/bin/llvm-config-21
          fi
          echo "Using LLVM_CONFIG=${LLVM_CONFIG:-default}"
          if ! pkg-config --exists SPIRV-Tools 2>/dev/null; then
            echo "SPIRV-Tools no encontrado via pkg-config; compilando SPIRV-Headers + SPIRV-Tools en /usr/local..."
            mkdir -p work/spirv-build && cd work/spirv-build
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
            cmake -S SPIRV-Headers -B build-headers -G Ninja -DCMAKE_INSTALL_PREFIX=/usr/local
            ninja -C build-headers install

            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git
            cmake -S SPIRV-Tools -B build-tools -G Ninja \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSPIRV-Headers_SOURCE_DIR="$PWD/SPIRV-Headers" \
              -DSPIRV_SKIP_TESTS=ON
            ninja -C build-tools install
            cd "$GITHUB_WORKSPACE"
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi

          meson setup build-host work/mesa \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Meson for PanVK G52
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          fi
          export CLANG_LIB_DIR="${CLANG_DIR:-$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux/aarch64}"
          echo "CLANG_LIB_DIR=$CLANG_LIB_DIR"

          mkdir -p shims/include/libdrm shims/include/xcb shims/include/X11
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cat <<'EOF' > shims/include/libdrm/drm.h
          #ifndef __SHIM_DRM_H__
          #define __SHIM_DRM_H__
          #include <stdint.h>
          typedef uint32_t drm_handle_t;
          #define DRM_SYNCOBJ_CREATE 0
          #define DRM_SYNCOBJ_DESTROY 0
          #define DRM_SYNCOBJ_HANDLE_TO_FD 0
          #define DRM_SYNCOBJ_FD_TO_HANDLE 0
          #define DRM_SYNCOBJ_WAIT 0
          #define DRM_SYNCOBJ_SIGNAL 0
          struct drm_syncobj_create { uint32_t handle; uint32_t flags; };
          struct drm_syncobj_destroy { uint32_t handle; uint32_t pad; };
          struct drm_syncobj_handle { uint32_t handle; uint32_t flags; int32_t fd; uint32_t pad; };
          struct drm_syncobj_wait { uint64_t handles; uint32_t count_handles; int64_t timeout_nsec; uint32_t flags; uint32_t first_signaled; uint32_t pad; };
          #endif
          EOF
          cat <<'EOF' > shims/include/libdrm/xf86drm.h
          #ifndef __SHIM_XF86DRM_H__
          #define __SHIM_XF86DRM_H__
          #include <stdint.h>
          #include <drm.h>
          static inline int drmSyncobjCreate(int fd, uint32_t flags, uint32_t *handle) { (void)fd; (void)flags; if (handle) *handle = 0; return -1; }
          static inline int drmSyncobjDestroy(int fd, uint32_t handle) { (void)fd; (void)handle; return -1; }
          static inline int drmSyncobjHandleToFD(int fd, uint32_t handle, int *obj_fd) { (void)fd; (void)handle; if (obj_fd) *obj_fd = -1; return -1; }
          static inline int drmSyncobjFDToHandle(int fd, int obj_fd, uint32_t *handle) { (void)fd; (void)obj_fd; if (handle) *handle = 0; return -1; }
          static inline int drmSyncobjWait(int fd, uint32_t *handles, uint32_t num_handles, int64_t timeout_nsec, uint32_t flags, uint32_t *first_signaled) { (void)fd; (void)handles; (void)num_handles; (void)timeout_nsec; (void)flags; (void)first_signaled; return -1; }
          static inline int drmSyncobjSignal(int fd, const uint32_t *handles, uint32_t num_handles) { (void)fd; (void)handles; (void)num_handles; return -1; }
          #endif
          EOF

          cat <<EOF > shims/libdrm.pc
          prefix=$GITHUB_WORKSPACE/shims
          exec_prefix=\${prefix}
          libdir=$NDK_SYSROOT/usr/lib/aarch64-linux-android/30
          includedir=\${prefix}/include

          Name: libdrm
          Description: Userspace interface to kernel DRM services (Android shim)
          Version: 2.4.131
          Libs: -L\${libdir}
          Cflags: -I\${includedir} -I\${includedir}/libdrm
          EOF

          PLATFORMS="android"
          if [ "${{ matrix.flavor }}" = "x11" ]; then
            PLATFORMS="android,x11"
            for pc_name in xcb xcb-randr x11-xcb xcb-keysyms xcb-dri3 xcb-present xcb-sync xcb-shm xcb-xfixes; do
              if [ ! -f "shims/${pc_name}.pc" ]; then
                cat <<EOF > "shims/${pc_name}.pc"
          prefix=$GITHUB_WORKSPACE/shims
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: ${pc_name}
          Description: ${pc_name} shim for cross-build
          Version: 1.17.0
          Cflags: -I\${includedir}
          EOF
              fi
            done
            cat <<'EOF' > shims/include/xcb/xcb.h
          #ifndef __SHIM_XCB_H__
          #define __SHIM_XCB_H__
          #include <stdint.h>
          typedef struct xcb_connection_t xcb_connection_t;
          typedef uint32_t xcb_window_t;
          typedef uint32_t xcb_drawable_t;
          typedef uint32_t xcb_visualid_t;
          typedef uint32_t xcb_colormap_t;
          typedef uint32_t xcb_gcontext_t;
          typedef uint32_t xcb_keycode_t;
          typedef struct { uint8_t pad0; } xcb_generic_event_t;
          typedef struct { uint8_t response_type; uint8_t pad0; uint16_t sequence; uint32_t length; int32_t error_code; } xcb_generic_error_t;
          typedef struct { uint32_t sequence; } xcb_void_cookie_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/randr.h
          #ifndef __SHIM_XCB_RANDR_H__
          #define __SHIM_XCB_RANDR_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef uint32_t xcb_randr_output_t;
          typedef uint32_t xcb_randr_crtc_t;
          typedef uint32_t xcb_randr_mode_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/xcb_keysyms.h
          #ifndef __SHIM_XCB_KEYSYMS_H__
          #define __SHIM_XCB_KEYSYMS_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef struct _xcb_key_symbols xcb_key_symbols_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/dri3.h
          #ifndef __SHIM_XCB_DRI3_H__
          #define __SHIM_XCB_DRI3_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef struct { uint8_t response_type; uint8_t nfd; uint16_t sequence; uint32_t length; uint32_t pixmap_size; int32_t fd; } xcb_dri3_buffer_from_pixmap_reply_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/present.h
          #ifndef __SHIM_XCB_PRESENT_H__
          #define __SHIM_XCB_PRESENT_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef uint32_t xcb_present_event_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/sync.h
          #ifndef __SHIM_XCB_SYNC_H__
          #define __SHIM_XCB_SYNC_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef uint32_t xcb_sync_fence_t;
          typedef uint32_t xcb_sync_counter_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/shm.h
          #ifndef __SHIM_XCB_SHM_H__
          #define __SHIM_XCB_SHM_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef uint32_t xcb_shm_seg_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/xcb/xfixes.h
          #ifndef __SHIM_XCB_XFIXES_H__
          #define __SHIM_XCB_XFIXES_H__
          #include <stdint.h>
          #include <xcb/xcb.h>
          typedef uint32_t xcb_xfixes_region_t;
          #endif
          EOF
            cat <<'EOF' > shims/include/X11/Xlib-xcb.h
          #ifndef __SHIM_XLIB_XCB_H__
          #define __SHIM_XLIB_XCB_H__
          #include <xcb/xcb.h>
          typedef struct _XDisplay Display;
          static inline xcb_connection_t *XGetXCBConnection(Display *dpy) { (void)dpy; return (xcb_connection_t *)0; }
          #endif
          EOF
          fi

          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -f android.toml ]; then
            envsubst < android.toml > android-cross.txt
          else
            cat <<EOF > android-cross.txt
          [binaries]
          c = '$TOOLCHAIN_BIN/aarch64-linux-android30-clang'
          cpp = '$TOOLCHAIN_BIN/aarch64-linux-android30-clang++'
          ar = '$TOOLCHAIN_BIN/llvm-ar'
          strip = '$TOOLCHAIN_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-L$CLANG_LIB_DIR']
          cpp_args = ['-L$CLANG_LIB_DIR']
          c_link_args = ['-L$CLANG_LIB_DIR']
          cpp_link_args = ['-L$CLANG_LIB_DIR']

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF
          fi
          cat android-cross.txt

          meson setup build work/mesa \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=$PLATFORMS \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase

      - name: Build PanVK driver
        run: |
          meson compile -C build

      - name: Package driver
        run: |
          ./scripts/package-release-zip.sh --flavor "${{ matrix.flavor }}" --version "${PANVK_RELEASE}"

      - name: Upload packaged ZIP driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G52-${{ matrix.flavor }}-release
          path: |
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}.zip
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}-MANIFEST.txt
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload raw driver binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-g52-aarch64-${{ matrix.flavor }}
          path: build/src/panfrost/vulkan/libvulkan_panfrost.so
          if-no-files-found: error
