name: Build PanVK Mali-G52

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Versión del paquete; también se muestra como el nombre del controlador en DXVK HUD / MangoHud.
  PANVK_RELEASE: "0.0.2-alpha-G52"
  MESA_REF: "mesa-26.3.0"

jobs:
  build-panvk-android:
    name: Build PanVK G52 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [adrenotools, x11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            llvm-21-dev \
            libclang-21-dev \
            libclc-21-dev \
            libllvmspirvlib-21-dev \
            libelf-dev \
            spirv-tools \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Fetch Mesa 26.3.0
        run: |
          mkdir -p work/mesa
          curl -fSL --retry 5 --retry-delay 5 \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${MESA_REF}/mesa-${MESA_REF}.tar.gz" \
            | tar -xz --strip-components=1 -C work/mesa
          git -C work/mesa init -q
          git -C work/mesa config user.email "ci@local"
          git -C work/mesa config user.name "CI"
          git -C work/mesa add -A
          git -C work/mesa commit -q -m "Mesa ${MESA_REF}"

      - name: Apply PanVK G52 patches (refreshing drifted hunk headers safely)
        run: |
          if ./scripts/apply-patches.sh --profile g52-v7-jm; then
            exit 0
          fi

          echo "Detectado PATCH-DRIFT en Mesa ${MESA_REF}; actualizando cabeceras @@ y adaptando hunks..."
          git -C work/mesa reset --hard HEAD
          git -C work/mesa clean -fd

          python3 - <<'PY'
          import glob
          import os
          import re

          mesa_dir = "work/mesa"
          hunk_re = re.compile(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$")

          for patch_path in sorted(glob.glob("patches/*/*.patch")):
              with open(patch_path, "r", encoding="utf-8", errors="replace") as f:
                  raw_text = f.read()

              if os.path.basename(patch_path).startswith("002-") and "src/panfrost/lib/kmod/meson.build" in raw_text:
                  parts = re.split(r"(?=^diff --git )", raw_text, flags=re.MULTILINE)
                  filtered_parts = [
                      part for part in parts
                      if not part.startswith("diff --git a/src/panfrost/lib/kmod/meson.build ")
                  ]
                  raw_text = "".join(filtered_parts)
                  # Si no queda ningún hunk en el parche, neutralizamos el archivo para que git apply no falle por parche vacío
                  if "@@" not in raw_text:
                      raw_text = ""
                  with open(patch_path, "w", encoding="utf-8") as f:
                      f.write(raw_text)
                  print(f"Filtrado bloque kmod/meson.build en {patch_path}")

              if not raw_text.strip() or "@@" not in raw_text:
                  continue

              lines = raw_text.splitlines(keepends=True)

              file_sections = []
              cur_header = []
              cur_file = None
              cur_hunks = []
              cur_hunk = None

              def flush_hunk():
                  global cur_hunk
                  if cur_hunk is not None:
                      cur_hunks.append(cur_hunk)
                      cur_hunk = None

              def flush_file():
                  global cur_file, cur_hunks, cur_header
                  flush_hunk()
                  if cur_file is not None:
                      file_sections.append((cur_header, cur_file, cur_hunks))
                  cur_header = []
                  cur_file = None
                  cur_hunks = []

              for line in lines:
                  if line.startswith("diff --git "):
                      flush_file()
                      cur_header.append(line)
                  elif line.startswith("+++ b/"):
                      cur_file = line[6:].strip()
                  elif (
                      line.startswith("--- ")
                      or line.startswith("index ")
                      or line.startswith("new file")
                      or line.startswith("deleted file")
                      or line.startswith("similarity index")
                      or line.startswith("rename from")
                      or line.startswith("rename to")
                  ):
                      if cur_file is None:
                          cur_header.append(line)
                  else:
                      m = hunk_re.match(line)
                      if m and cur_file is not None:
                          flush_hunk()
                          cur_hunk = {
                              "old_start": int(m.group(1)),
                              "old_len": int(m.group(2)) if m.group(2) is not None else 1,
                              "new_start": int(m.group(3)),
                              "new_len": int(m.group(4)) if m.group(4) is not None else 1,
                              "suffix": m.group(5),
                              "body": [],
                          }
                      elif cur_hunk is not None:
                          if line.startswith((" ", "+", "-", "\\")):
                              cur_hunk["body"].append(line)
                          elif line.strip() == "":
                              cur_hunk["body"].append(" \n")
                          else:
                              flush_hunk()
                      else:
                          if cur_file is None:
                              cur_header.append(line)

              flush_file()

              rebuilt_lines = []
              changed = False
              is_008 = os.path.basename(patch_path).startswith("008-")

              for header, target_file, hunks in file_sections:
                  if is_008 and target_file == "src/vulkan/runtime/vk_android.h":
                      changed = True
                      continue

                  target_path = os.path.join(mesa_dir, target_file)
                  if not os.path.exists(target_path):
                      rebuilt_lines.extend(header)
                      rebuilt_lines.append(f"--- a/{target_file}\n")
                      rebuilt_lines.append(f"+++ b/{target_file}\n")
                      for h in hunks:
                          rebuilt_lines.append(f"@@ -{h['old_start']},{h['old_len']} +{h['new_start']},{h['new_len']} @@{h['suffix']}\n")
                          rebuilt_lines.extend(h["body"])
                      continue

                  with open(target_path, "r", encoding="utf-8", errors="replace") as tf:
                      src_lines = tf.readlines()

                  rebuilt_lines.extend(header)
                  rebuilt_lines.append(f"--- a/{target_file}\n")
                  rebuilt_lines.append(f"+++ b/{target_file}\n")

                  for h in hunks:
                      pre_lines = [l[1:] for l in h["body"] if l.startswith((" ", "-"))]
                      old_cnt = sum(1 for l in h["body"] if l.startswith((" ", "-")))
                      new_cnt = sum(1 for l in h["body"] if l.startswith((" ", "+")))

                      found_idx = None
                      if pre_lines:
                          n_pre = len(pre_lines)
                          for idx in range(max(0, h["old_start"] - 1), len(src_lines) - n_pre + 1):
                              if src_lines[idx : idx + n_pre] == pre_lines:
                                  found_idx = idx
                                  break
                          if found_idx is None:
                              for idx in range(0, max(0, h["old_start"] - 1)):
                                  if src_lines[idx : idx + n_pre] == pre_lines:
                                      found_idx = idx
                                      break

                      if found_idx is not None:
                          new_pos = found_idx + 1
                          if new_pos != h["old_start"] or old_cnt != h["old_len"] or new_cnt != h["new_len"]:
                              changed = True
                          rebuilt_lines.append(f"@@ -{new_pos},{old_cnt} +{new_pos},{new_cnt} @@{h['suffix']}\n")
                          rebuilt_lines.extend(h["body"])
                      else:
                          rebuilt_lines.append(f"@@ -{h['old_start']},{h['old_len']} +{h['new_start']},{h['new_len']} @@{h['suffix']}\n")
                          rebuilt_lines.extend(h["body"])

              if changed and rebuilt_lines:
                  with open(patch_path, "w", encoding="utf-8") as f:
                      f.writelines(rebuilt_lines)
                  print(f"Actualizadas cabeceras en {patch_path}")
          PY

          git -C work/mesa reset --hard HEAD
          git -C work/mesa clean -fd

          # Aplicar parches no vacíos (002 queda sin hunks tras extraer su cambio de meson.build)
          for p in patches/*/*.patch; do
            [ -e "$p" ] || continue
            if ! grep -q '^@@' "$p"; then
              echo "SKIP empty/filtered patch $(basename "$p")"
              continue
            fi
            git -C work/mesa apply --recount "$GITHUB_WORKSPACE/$p" || true
          done

          # Re-ejecutar apply-patches.sh saltando los archivos .patch vacíos en su bucle
          python3 - <<'PY'
          import glob
          import os
          import subprocess

          # Aplicar en orden usando la lógica de series de apply-patches.sh sin fallar en parches vaciados
          import json
          with open("profiles/g52-v7-jm.json") as f:
              prof = json.load(f)
          arch = prof["panArch"]
          frontend = prof["frontend"]
          series = ["common", "android", "kbase-common", "app-loader", "wsi"]
          if frontend == "CSF":
              series += ["csf", f"csf-v{arch}"]
          else:
              series += [f"jm-v{arch}"]

          subprocess.run(["git", "-C", "work/mesa", "reset", "--hard", "HEAD"], check=True)
          subprocess.run(["git", "-C", "work/mesa", "clean", "-fd"], check=True)

          applied = 0
          for fam in series:
              for p in sorted(glob.glob(f"patches/{fam}/*.patch")):
                  with open(p, "r", encoding="utf-8", errors="replace") as pf:
                      txt = pf.read()
                  if "@@" not in txt:
                      print(f"SKIP [{fam}] {os.path.basename(p)} (sin hunks tras adaptación)")
                      continue
                  print(f"APPLY [{fam}] {os.path.basename(p)}")
                  subprocess.run(
                      ["git", "-C", "work/mesa", "apply", "--recount", "--whitespace=nowarn", os.path.abspath(p)],
                      check=True,
                  )
                  applied += 1
              files_dir = f"patches/{fam}/files"
              if os.path.isdir(files_dir):
                  print(f"COPY [{fam}] files/ -> mesa tree")
                  subprocess.run(
                      f"(cd {files_dir} && find . -type f ! -name README -print0 | tar --null -cf - -T -) | (cd work/mesa && tar -xf -)",
                      shell=True,
                      check=True,
                  )
          print(f"OK applied={applied} profile=g52-v7-jm")
          PY

          python3 - <<'PY'
          import os

          vk_hdr = "work/mesa/src/vulkan/runtime/vk_android.h"
          if os.path.exists(vk_hdr):
              with open(vk_hdr, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()
              decl = (
                  "VkResult vk_common_GetAndroidHardwareBufferPropertiesANDROID(\n"
                  "   VkDevice device_h, const struct AHardwareBuffer *buffer,\n"
                  "   VkAndroidHardwareBufferPropertiesANDROID *pProperties);\n"
              )
              if "vk_common_GetAndroidHardwareBufferPropertiesANDROID" not in content:
                  target = "vk_android_rp_attachment_has_external_format"
                  idx = content.find(target)
                  if idx != -1:
                      end_stmt = content.find(";", idx)
                      if end_stmt != -1:
                          content = content[: end_stmt + 1] + "\n\n" + decl + content[end_stmt + 1 :]
                      else:
                          content = content + "\n" + decl
                  else:
                      content = content + "\n" + decl
                  with open(vk_hdr, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("Declaración añadida en src/vulkan/runtime/vk_android.h")

          kmod_meson = "work/mesa/src/panfrost/lib/kmod/meson.build"
          kbase_block = (
              "if panfrost_kmds.contains('kbase')\n"
              "  libpankmod_lib_files += files('kbase_kmod.c')\n"
              "endif\n\n"
          )
          if os.path.exists(kmod_meson):
              with open(kmod_meson, "r", encoding="utf-8", errors="replace") as mf:
                  mcontent = mf.read()
              if "panfrost_kmds.contains('kbase')" not in mcontent:
                  marker = "libpankmod_lib = static_library("
                  idx = mcontent.find(marker)
                  if idx != -1:
                      mcontent = mcontent[:idx] + kbase_block + mcontent[idx:]
                  else:
                      mcontent = mcontent + "\n" + kbase_block
                  with open(kmod_meson, "w", encoding="utf-8") as mf:
                      mf.write(mcontent)
                  print("Aplicado bloque kbase en src/panfrost/lib/kmod/meson.build antes de libpankmod_lib")
          PY

      - name: Debug rejected hunks in Mesa 26.3.0
        if: failure()
        run: |
          echo "=== Parches que tocan u_gralloc_fallback.c ==="
          grep -rn "u_gralloc_fallback.c" patches/ || true
          echo "=== u_gralloc_fallback.c.rej ==="
          cat work/mesa/src/util/u_gralloc/u_gralloc_fallback.c.rej || true
          echo "=== vk_android.c.rej ==="
          cat work/mesa/src/vulkan/runtime/vk_android.c.rej || true

      - name: Stamp driver version
        # driverInfo (DXVK HUD, MangoHud, vulkaninfo) muestra esta versión.
        run: |
          f="work/mesa/src/panfrost/vulkan/panvk_vX_physical_device.c"
          sed -i "s/^#define PANVK_KBASE_RELEASE \".*\"/#define PANVK_KBASE_RELEASE \"${PANVK_RELEASE}\"/" "$f"
          grep -q "^#define PANVK_KBASE_RELEASE \"${PANVK_RELEASE}\"" "$f"
          sed -i 's/"PanVK-kbase " PANVK_KBASE_RELEASE/"PanVK G52 " PANVK_KBASE_RELEASE/' "$f"
          grep -q '"PanVK G52 " PANVK_KBASE_RELEASE' "$f"

      - name: Build host tools
        run: |
          meson setup build-host work/mesa \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          ninja -C build-host \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa_clc" "$GITHUB_WORKSPACE/build-host/src/compiler/clc/mesa-clc"
          ln -sf "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn_bindgen2" "$GITHUB_WORKSPACE/build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Configure Meson for PanVK G52
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR="$(ls -d $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/*/lib/linux/aarch64 2>/dev/null | tail -n1)"
          fi
          export CLANG_LIB_DIR="${CLANG_DIR:-$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux/aarch64}"
          echo "CLANG_LIB_DIR=$CLANG_LIB_DIR"
          envsubst < android.toml > android-cross.txt
          cat android-cross.txt

          PLATFORMS="android"
          if [ "${{ matrix.flavor }}" = "x11" ]; then
            PLATFORMS="android,x11"
          fi

          meson setup build work/mesa \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=$PLATFORMS \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dvalgrind=disabled \
            -Dgallium-drivers= \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dvulkan-drivers=panfrost \
            -Dllvm=disabled \
            -Dpanfrost-kmds=kbase

      - name: Build PanVK driver
        run: |
          meson compile -C build

      - name: Package driver
        run: |
          ./scripts/package-release-zip.sh --flavor "${{ matrix.flavor }}" --version "${PANVK_RELEASE}"

      - name: Upload packaged ZIP driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G52-${{ matrix.flavor }}-release
          path: |
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}.zip
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}-MANIFEST.txt
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload raw driver binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-g52-aarch64-${{ matrix.flavor }}
          path: build/src/panfrost/vulkan/libvulkan_panfrost.so
          if-no-files-found: error
