name: Build PanVK Mali-G52 (.adpkg)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  PROFILE: "g52-v7-jm"
  PANVK_RELEASE: "26.3.0-devel-G52"
  LLVM_VER: "21"

jobs:
  build-panvk-g52:
    name: Build PanVK Mali-G52 (g52-v7-jm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and package PanVK Mali-G52
        env:
          PANVK_RELEASE: ${{ env.PANVK_RELEASE }}
        run: ./build.sh

      - name: Upload .adpkg and driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g52-v7-jm-aarch64-adpkg
          path: |
            dist/**/*.adpkg
            dist/android-${{ env.PROFILE }}/libvulkan_panfrost.so
          if-no-files-found: error
