name: Build PanVK Bifrost (Mali-G52)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment & Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools ninja-build flex bison wget unzip git
          pip3 install meson mako pyyaml
          
          # Descargar e instalar Android NDK r25c
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Fetch Mesa sources
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/fetch-mesa.sh

      - name: Apply Panfrost / Kbase patches
        run: |
          ./scripts/apply-patches.sh || true

      - name: Create Correct Android Cross-File
        run: |
          mkdir -p scripts
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat << EOF > ./scripts/android-aarch64.meson
          [binaries]
          c = '$NDK_BIN/aarch64-linux-android30-clang'
          cpp = '$NDK_BIN/aarch64-linux-android30-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF
          echo "Archivo android-aarch64.meson creado correctamente."

      - name: Configure Mesa with Meson (Bifrost / Panfrost)
        run: |
          mkdir -p build
          meson setup build/ work/mesa \
            --cross-file ./scripts/android-aarch64.meson \
            -Dplatforms=android \
            -Dplatform-sdk-version=30 \
            -Dgallium-drivers=panfrost \
            -Dvulkan-drivers=panfrost \
            -Dbuildtype=release \
            -Dwrap_mode=forcefallback

      - name: Compile PanVK Driver
        run: |
          ninja -C build/

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-bifrost-g52-driver
          path: |
            build/src/panfrost/vulkan/libvulkan_panfrost.so
            build/src/vulkan/libvulkan_panfrost.so
            build/**/*.so
