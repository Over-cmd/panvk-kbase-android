name: Build PanVK Bifrost JM (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "g52-v7-jm"
      llvm_ver:
        description: "LLVM version"
        required: true
        default: "21"
      android_api:
        description: "Android API level"
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build script
        env:
          PROFILE: ${{ inputs.profile }}
          LLVM_VER: ${{ inputs.llvm_ver }}
          ANDROID_API: ${{ inputs.android_api }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload kbase_kmod.c on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kbase-kmod-debug-${{ inputs.profile }}
          path: work/mesa/src/panfrost/lib/kmod/kbase_kmod.c
          if-no-files-found: ignore

      - name: Upload built driver and package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-android-${{ inputs.profile }}
          path: |
            dist/android-${{ inputs.profile }}/libvulkan_panfrost.so
            dist/android-${{ inputs.profile }}/*.adpkg
          if-no-files-found: ignore
