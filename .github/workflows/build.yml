name: Build PanVK Mali-G52 (.adpkg)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  PROFILE: "g52-v7-jm"
  PANVK_RELEASE: "26.3.0-devel-G52"
  LLVM_VER: "21"

jobs:
  build-panvk-g52:
    name: Build PanVK Mali-G52 (g52-v7-jm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies (Clang/LLVM 21)
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            clang-${LLVM_VER} \
            lld-${LLVM_VER} \
            llvm-${LLVM_VER}-dev \
            libclang-${LLVM_VER}-dev \
            libclc-${LLVM_VER}-dev \
            libllvmspirvlib-${LLVM_VER}-dev \
            libelf-dev \
            spirv-tools \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext-base \
            gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Verify sources.lock and profile
        run: |
          python3 -c "import json; d=json.load(open('sources.lock')); assert len(d['mesaCommit'])==40, d"
          ls -la "profiles/${PROFILE}" || true

      - name: Fetch Mesa
        run: |
          ./scripts/fetch-mesa.sh

      - name: Diagnose jm-v7/003 in kbase_kmod.c
        run: |
          echo "=== KBASE_IOCTL_MEM_JIT_INIT en kbase_kmod.c ==="
          grep -n -C 15 "KBASE_IOCTL_MEM_JIT_INIT" work/mesa/src/panfrost/lib/kmod/kbase_kmod.c || true
          echo "=== KBASE_JM_MEM_TILER_ALIGN_TOP o kbase_kmod_bo_alloc en kbase_kmod.c ==="
          grep -n -C 15 "KBASE_JM_MEM_TILER_ALIGN_TOP" work/mesa/src/panfrost/lib/kmod/kbase_kmod.c || true

      - name: Apply patches for Mali-G52
        run: |
          ./scripts/apply-patches.sh --profile "${PROFILE}"

      - name: Build Android driver for AArch64 (LLVM 21)
        env:
          CC: "clang-${LLVM_VER}"
          CXX: "clang++-${LLVM_VER}"
          LD: "ld.lld-${LLVM_VER}"
          LLVM_CONFIG: "llvm-config-${LLVM_VER}"
          PANVK_RELEASE: ${{ env.PANVK_RELEASE }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          ./scripts/build-android.sh --profile "${PROFILE}"

      - name: Validate compiled AArch64 binary
        run: |
          ./scripts/validate-binary.sh --abi android "dist/android-${PROFILE}/libvulkan_panfrost.so"

      - name: Package Android .adpkg
        run: |
          ./scripts/package-android-adpkg.sh --profile "${PROFILE}"

      - name: Upload .adpkg and driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g52-v7-jm-aarch64-adpkg
          path: |
            dist/**/*.adpkg
            dist/android-${{ env.PROFILE }}/libvulkan_panfrost.so
          if-no-files-found: error
