name: Build PanVK Mali-G52 for Winlator Bionic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment & Android NDK
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools ninja-build flex bison wget unzip git pkg-config cmake libdrm-dev libglvnd-dev glslang-tools llvm-20-dev libclang-20-dev libclc-20-dev libllvmspirvlib-20-dev libelf-dev spirv-tools
          pip3 install meson mako pyyaml packaging
          
          # Descargar e instalar Android NDK r25c
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Fetch Mesa sources & libdrm
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/fetch-mesa.sh
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git work/libdrm

      - name: Apply Bifrost / PanVK Patches & Fix Format Specifier
        run: |
          ./scripts/apply-patches.sh || true
          sed -i 's/%#b/%#x/g' work/mesa/src/vulkan/runtime/vk_android.c

      - name: Generate Host Tools (Mesa Clc & Panfrost Compiler)
        run: |
          meson setup build-host work/mesa \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          
          mkdir -p host-bins
          ln -sf "$PWD/build-host/src/compiler/clc/mesa_clc" host-bins/mesa_clc
          ln -sf "$PWD/build-host/src/compiler/spirv/vtn_bindgen2" host-bins/vtn_bindgen2
          ln -sf "$PWD/build-host/src/compiler/clc/mesa_clc" host-bins/mesa-clc
          ln -sf "$PWD/build-host/src/compiler/spirv/vtn_bindgen2" host-bins/vtn-bindgen2
          ln -sf "$PWD/build-host/src/panfrost/clc/panfrost_compile" host-bins/panfrost_compile
          
          echo "$PWD/host-bins" >> $GITHUB_PATH

      - name: Create Cross-File for Bionic/Winlator
        run: |
          mkdir -p scripts android-spirv-headers/spirv-tools
          cp -r /usr/include/spirv-tools/* android-spirv-headers/spirv-tools/ 2>/dev/null || true
          
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat << EOF > ./scripts/android-aarch64.meson
          [binaries]
          c = '$NDK_BIN/aarch64-linux-android30-clang'
          cpp = '$NDK_BIN/aarch64-linux-android30-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Build libdrm for Android
        run: |
          mkdir -p build-libdrm android-drm-installed
          meson setup build-libdrm work/libdrm \
            --cross-file ./scripts/android-aarch64.meson \
            --prefix=$PWD/android-drm-installed \
            -Dintel=disabled \
            -Dradeon=disabled \
            -Damdgpu=disabled \
            -Dnouveau=disabled \
            -Dvmwgfx=disabled \
            -Domap=disabled \
            -Dexynos=disabled \
            -Dtegra=false \
            -Detnaviv=disabled \
            -Dinstall-test-programs=false \
            -Dbuildtype=release
          ninja -C build-libdrm install

      - name: Configure Mesa for Android Cross-Compile
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/android-drm-installed/lib/pkgconfig:${{ github.workspace }}/android-drm-installed/share/pkgconfig
        run: |
          mkdir -p build
          meson setup build/ work/mesa \
            --cross-file ./scripts/android-aarch64.meson \
            -Dplatforms=android \
            -Dplatform-sdk-version=28 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dzstd=disabled \
            -Dbuildtype=release \
            -Dwrap_mode=forcefallback

      - name: Compile PanVK Driver
        run: |
          ninja -C build/

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mali-g52-bionic-driver
          path: |
            build/src/panfrost/vulkan/libvulkan_panfrost.so
            build/src/vulkan/libvulkan_panfrost.so
            build/**/*.so
