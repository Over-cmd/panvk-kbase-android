name: Build PanVK Mali-G52

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Versión del paquete; también se muestra como el nombre del controlador en DXVK HUD / MangoHud.
  PANVK_RELEASE: "0.0.2-alpha-G52"
  MESA_REF: "mesa-26.3.0"

jobs:
  build-panvk-android:
    name: Build PanVK G52 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [adrenotools, x11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential cmake ninja-build llvm-21-dev libclang-21-dev \
            libclc-21-dev libllvmspirvlib-21-dev libelf-dev spirv-tools \
            bison flex libdrm-dev pkg-config gettext
          SPIRV_PKGS=$(apt-cache search --names-only '^(lib)?spirv-(tools|headers)(-dev)?$' | awk '{print $1}' | tr '\n' ' ')
          [ -n "$SPIRV_PKGS" ] && sudo apt-get install -y --no-install-recommends $SPIRV_PKGS || true
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Fetch Mesa 26.3.0
        run: |
          mkdir -p work/mesa
          curl -fSL --retry 5 --retry-delay 5 \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${MESA_REF}/mesa-${MESA_REF}.tar.gz" \
            | tar -xz --strip-components=1 -C work/mesa
          git -C work/mesa init -q
          git -C work/mesa config user.email "ci@local"
          git -C work/mesa config user.name "CI"
          git -C work/mesa add -A
          git -C work/mesa commit -q -m "Mesa ${MESA_REF}"

      - name: Build PanVK G52
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          chmod +x build.sh
          ./build.sh "$FLAVOR"

      - name: Package driver
        run: |
          ./scripts/package-release-zip.sh --flavor "${{ matrix.flavor }}" --version "${PANVK_RELEASE}"

      - name: Upload packaged ZIP driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G52-${{ matrix.flavor }}-release
          path: |
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}.zip
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}-MANIFEST.txt
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload raw driver binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-g52-aarch64-${{ matrix.flavor }}
          path: build/src/panfrost/vulkan/libvulkan_panfrost.so
          if-no-files-found: error
