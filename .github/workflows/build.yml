name: Build PanVK Mali-G52 for Winlator Bionic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment & Android NDK
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools ninja-build flex bison wget unzip git pkg-config cmake libdrm-dev libglvnd-dev glslang-tools llvm-20-dev libclang-20-dev libclc-20-dev libllvmspirvlib-20-dev libelf-dev spirv-tools zip
          pip3 install meson mako pyyaml packaging
          
          # Descargar e instalar Android NDK r25c
          echo "Descargando Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Fetch Mesa sources & libdrm
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/fetch-mesa.sh
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git work/libdrm

      - name: Apply Bifrost / PanVK Patches & Fix Format Specifier
        run: |
          ./scripts/apply-patches.sh || true
          sed -i 's/%#b/%#x/g' work/mesa/src/vulkan/runtime/vk_android.c

      - name: Generate Host Tools (Mesa Clc & Panfrost Compiler)
        run: |
          meson setup build-host work/mesa \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dplatforms=[] \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=[] \
            -Dtools=panfrost \
            -Dprecomp-compiler=enabled \
            -Dinstall-precomp-compiler=true \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true
          
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          
          mkdir -p host-bins
          ln -sf "$PWD/build-host/src/compiler/clc/mesa_clc" host-bins/mesa_clc
          ln -sf "$PWD/build-host/src/compiler/spirv/vtn_bindgen2" host-bins/vtn_bindgen2
          ln -sf "$PWD/build-host/src/compiler/clc/mesa_clc" host-bins/mesa-clc
          ln -sf "$PWD/build-host/src/compiler/spirv/vtn_bindgen2" host-bins/vtn-bindgen2
          ln -sf "$PWD/build-host/src/panfrost/clc/panfrost_compile" host-bins/panfrost_compile
          
          echo "$PWD/host-bins" >> $GITHUB_PATH

      - name: Create Cross-File for Bionic/Winlator
        run: |
          mkdir -p scripts android-spirv-headers/spirv-tools
          cp -r /usr/include/spirv-tools/* android-spirv-headers/spirv-tools/ 2>/dev/null || true
          
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat << EOF > ./scripts/android-aarch64.meson
          [binaries]
          c = '$NDK_BIN/aarch64-linux-android30-clang'
          cpp = '$NDK_BIN/aarch64-linux-android30-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Build libdrm for Android
        run: |
          mkdir -p build-libdrm android-drm-installed
          meson setup build-libdrm work/libdrm \
            --cross-file ./scripts/android-aarch64.meson \
            --prefix=$PWD/android-drm-installed \
            -Dintel=disabled \
            -Dradeon=disabled \
            -Damdgpu=disabled \
            -Dnouveau=disabled \
            -Dvmwgfx=disabled \
            -Domap=disabled \
            -Dexynos=disabled \
            -Dtegra=disabled \
            -Detnaviv=disabled \
            -Dinstall-test-programs=false \
            -Dbuildtype=release
          ninja -C build-libdrm install

      - name: Configure Mesa for Android Cross-Compile
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/android-drm-installed/lib/pkgconfig:${{ github.workspace }}/android-drm-installed/share/pkgconfig
        run: |
          mkdir -p build
          meson setup build/ work/mesa \
            --cross-file ./scripts/android-aarch64.meson \
            -Dplatforms=android \
            -Dplatform-sdk-version=28 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dzstd=disabled \
            -Dbuildtype=release \
            -Dwrap_mode=forcefallback

      - name: Compile PanVK Driver & Package for Winlator
        run: |
          ninja -C build/
          
          # Nombre del paquete e instalación
          PKG_DIR="Mesa-PanVK-26.3.0-devel-795ca7ff"
          mkdir -p "$PKG_DIR"
          
          # Copiar la librería compilada
          cp build/src/panfrost/vulkan/libvulkan_panfrost.so "$PKG_DIR/"
          
          # Calcular SHA256 del binario .so
          SO_HASH=$(sha256sum "$PKG_DIR/libvulkan_panfrost.so" | awk '{print $1}')
          
          # 1. Generar SHA256SUMS.txt
          echo "$SO_HASH  libvulkan_panfrost.so" > "$PKG_DIR/SHA256SUMS.txt"
          
          # 2. Generar Meta.json
          cat << EOF > "$PKG_DIR/Meta.json"
          {
            "schemaVersion": 1,
            "name": "$PKG_DIR",
            "description": "Mesa PanVK 26.3.0-devel (git-795ca7ff3e): Vulkan driver for Mali GPUs on the mali_kbase kernel driver, package 26.3.1. Package for bannerlator (com.winlator.banner); see README-bannerlator.txt for the direct-ICD (no wrapper) setting.",
            "author": "panvk-kbase-android",
            "packageVersion": "26.3.1",
            "vendor": "Mesa",
            "driverVersion": "Mesa 26.3.0-devel (git-795ca7ff3e, p0175, 2026-10-31)",
            "minApi": 28,
            "libraryName": "libvulkan_panfrost.so"
          }
          EOF

          # 3. Generar Panvk_icd.aarch64.json (Ruta relativa)
          cat << EOF > "$PKG_DIR/Panvk_icd.aarch64.json"
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "./libvulkan_panfrost.so",
              "api_version": "1.4.363"
            }
          }
          EOF

          # 4. Generar panvk_icd_abs.aarch64.json (Ruta absoluta de Winlator / bannerlator)
          cat << EOF > "$PKG_DIR/panvk_icd_abs.aarch64.json"
          {
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "/data/data/com.winlator.banner/files/contents/adrenotools/$PKG_DIR/libvulkan_panfrost.so",
              "api_version": "1.4.363"
            }
          }
          EOF

          # 5. Generar README-bannerlator.txt
          cat << EOF > "$PKG_DIR/README-bannerlator.txt"
          Mesa PanVK 26.3.0-devel (git-795ca7ff3e) for bannerlator (com.winlator.banner)
          Install: Adrenotools GPU Drivers > Install > pick this zip. It installs to
            /data/data/com.winlator.banner/files/contents/adrenotools/$PKG_DIR/
          Direct load (no wrapper ICD): container > Environment, add
            VK_ICD_FILENAMES=/data/data/com.winlator.banner/files/contents/adrenotools/$PKG_DIR/panvk_icd_abs.aarch64.json
          (container env vars are applied after the app sets the wrapper ICD, so this replaces it).
          If the X11 present path fails, also add MESA_VK_WSI_DEBUG=sw.
          Fallback (wrapper in path): leave VK_ICD_FILENAMES unset and pick "$PKG_DIR" as Graphics Driver Version.
          Check: wine log / logcat shows driverInfo "Mesa 26.3.0-devel (git-795ca7ff3e, p0175, 2026-10-31)"; .so sha256 $SO_HASH
          EOF

          # Empaquetar todo en un ZIP
          zip -r "${PKG_DIR}.zip" "$PKG_DIR"

      - name: Upload Winlator Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-PanVK-26.3.0-devel-795ca7ff
          path: Mesa-PanVK-26.3.0-devel-795ca7ff.zip
