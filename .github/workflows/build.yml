name: Build PanVK Mali-G52 (.adpkg)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  PROFILE: "g52-v7-jm"
  PANVK_RELEASE: "26.3.0-devel-G52"
  LLVM_VER: "21"

jobs:
  build-panvk-g52:
    name: Build PanVK Mali-G52 (g52-v7-jm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies (Clang/LLVM 21)
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            clang-${LLVM_VER} \
            lld-${LLVM_VER} \
            llvm-${LLVM_VER}-dev \
            libclang-${LLVM_VER}-dev \
            libclc-${LLVM_VER}-dev \
            libllvmspirvlib-${LLVM_VER}-dev \
            libelf-dev \
            spirv-tools \
            bison \
            flex \
            libdrm-dev \
            pkg-config \
            gettext-base \
            gettext
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Verify sources.lock and profile
        run: |
          python3 -c "import json; d=json.load(open('sources.lock')); assert len(d['mesaCommit'])==40, d"
          test -f "profiles/${PROFILE}.json"

      - name: Fetch Mesa
        run: |
          ./scripts/fetch-mesa.sh

      - name: Apply patches for Mali-G52
        run: |
          if ./scripts/apply-patches.sh --profile "${PROFILE}"; then
            exit 0
          fi

          git -C work/mesa checkout -- .
          git -C work/mesa clean -fd
          ./scripts/apply-patches.sh --profile "${PROFILE}" || true

          cat << 'EOF' > /tmp/patch_kbase.py
from pathlib import Path

target = Path("work/mesa/src/panfrost/lib/kmod/kbase_kmod.c")
lines = target.read_text(encoding="utf-8").splitlines(keepends=True)

start_jit = next(
    i for i, l in enumerate(lines)
    if "struct kbase_ioctl_mem_jit_init jit_init" in l
)
end_jit = next(
    i for i in range(start_jit, len(lines))
    if lines[i].strip() == "}" and i > start_jit + 3
) + 1

jit_replacement = [
    "\t/* Bifrost (arch < 9) JM: nothing we allocate needs JIT or CUSTOM_VA\n",
    "\t * (the tiler heap is a SAME_VA GROW_ON_GPF BO), and JIT_INIT fails with\n",
    "\t * ENOMEM on G52 r1 kernels, so skip it (as JimVulkan/mali-panvk, MIT). */\n",
    "\tuint64_t raw_id = kbase_gpuprop_get(props_buf, props_size,\n",
    "\t\t\t\t\t    KBASE_GPUPROP_RAW_GPU_ID, 0);\n",
    "\tif (!raw_id)\n",
    "\t\traw_id = kbase_gpuprop_get(props_buf, props_size,\n",
    "\t\t\t\t\t   KBASE_GPUPROP_PRODUCT_ID, 0) << 16;\n",
    "\tif (!is_csf && raw_id && pan_arch(raw_id & 0xffffffffu) < 9) {\n",
    "\t\tmesa_logi(\"kbase: v%u JM, KBASE_IOCTL_MEM_JIT_INIT skipped; tiler \"\n",
    "\t\t\t  \"heap is a GROW_ON_GPF region\",\n",
    "\t\t\t  pan_arch(raw_id & 0xffffffffu));\n",
    "\t} else if (ioctl(fd, KBASE_IOCTL_MEM_JIT_INIT, &jit_init)) {\n",
    "\t\tmesa_logw(\"kbase: KBASE_IOCTL_MEM_JIT_INIT failed: %s \"\n",
    "\t\t\t  \"(tiler heap creation will not work)\", strerror(errno));\n",
    "\t}\n",
]

start_bo = next(
    i for i, l in enumerate(lines)
    if "PAN_KMOD_BO_FLAG_ALLOC_ON_FAULT" in l and l.lstrip().startswith("if ")
)
end_bo = next(
    i for i in range(start_bo, len(lines))
    if lines[i].strip() == "}"
) + 1

bo_addition = [
    "\n",
    "   /* Bifrost JM (no JIT, see dev_create): commit 1 MiB up front and let\n",
    "    * GPU faults grow the rest in 2 MiB steps (JimVulkan/mali-panvk). */\n",
    "   if (!kbase_dev->is_csf && pan_arch(dev->props.gpu_id) < 9 &&\n",
    "       (kmod_flags & PAN_KMOD_BO_FLAG_NO_MMAP)) {\n",
    "      commit_pages = MIN2((1024 * 1024) / page_size, va_pages);\n",
    "      mesa_logi(\"kbase: v%u growable BO, GROW_ON_GPF, %\" PRIu64\n",
    "                \" of %\" PRIu64 \" pages committed\",\n",
    "                pan_arch(dev->props.gpu_id), commit_pages, va_pages);\n",
    "   }\n",
]

new_lines = list(lines)
new_lines[end_bo:end_bo] = bo_addition
new_lines[start_jit:end_jit] = jit_replacement
target.write_text("".join(new_lines), encoding="utf-8")
print("Updated kbase_kmod.c cleanly")
EOF

          python3 /tmp/patch_kbase.py

      - name: Build Android driver for AArch64 (LLVM 21)
        env:
          PANVK_RELEASE: ${{ env.PANVK_RELEASE }}
        run: |
          export CC="clang-${LLVM_VER}"
          export CXX="clang++-${LLVM_VER}"
          export LD="ld.lld-${LLVM_VER}"
          export LLVM_CONFIG="llvm-config-${LLVM_VER}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          ./scripts/build-android.sh --profile "${PROFILE}"

      - name: Validate compiled AArch64 binary
        run: |
          ./scripts/validate-binary.sh --abi android "dist/android-${PROFILE}/libvulkan_panfrost.so"

      - name: Package Android .adpkg
        run: |
          ./scripts/package-android-adpkg.sh --profile "${PROFILE}"

      - name: Upload .adpkg and driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g52-v7-jm-aarch64-adpkg
          path: |
            dist/**/*.adpkg
            dist/android-${{ env.PROFILE }}/libvulkan_panfrost.so
          if-no-files-found: error
