name: Build PanVK Mali-G52

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Versión del paquete; también se muestra como el nombre del controlador en DXVK HUD / MangoHud.
  PANVK_RELEASE: "0.0.2-alpha-G52"
  MESA_REF: "mesa-26.3.0"

jobs:
  build-panvk-android:
    name: Build PanVK G52 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [adrenotools, x11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential cmake ninja-build zip unzip llvm-21-dev libclang-21-dev \
            libclc-21-dev libllvmspirvlib-21-dev libelf-dev spirv-tools \
            bison flex libdrm-dev pkg-config gettext
          SPIRV_PKGS=$(apt-cache search --names-only '^(lib)?spirv-(tools\vert{}headers)(-dev)?$' | awk '{print $1}' | tr '\n' ' ')
          [ -n "$SPIRV_PKGS" ] && sudo apt-get install -y --no-install-recommends $SPIRV_PKGS || true
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Fetch Mesa 26.3.0
        run: |
          rm -rf work/mesa
          mkdir -p work/mesa
          curl -fSL --retry 5 --retry-delay 5 \
            "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${MESA_REF}/mesa-${MESA_REF}.tar.gz" \
            | tar -xz --strip-components=1 -C work/mesa
          git -C work/mesa init -q
          git -C work/mesa config user.email "ci@local"
          git -C work/mesa config user.name "CI"
          git -C work/mesa add -A
          git -C work/mesa commit -q -m "Mesa ${MESA_REF}"
          git -C work/mesa tag -f "${MESA_REF}"

      - name: Build PanVK G52
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          chmod +x build.sh
          ./build.sh "$FLAVOR"

      - name: Package driver
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail

          ROOT_DIR="$PWD"
          SO_PATH="$(find "$ROOT_DIR/build" -name 'libvulkan_panfrost.so' -type f | head -n 1)"
          if [ -z "$SO_PATH" ]; then
            echo "ERROR: No se encontró libvulkan_panfrost.so en build/" >&2
            exit 1
          fi

          PKG_DIR="$ROOT_DIR/pkg_out_${FLAVOR}"
          ZIP_NAME="PanVK-G52-${PANVK_RELEASE}-${FLAVOR}.zip"
          MANIFEST_NAME="PanVK-G52-${PANVK_RELEASE}-${FLAVOR}-MANIFEST.txt"

          rm -rf "$PKG_DIR" "$ROOT_DIR/$ZIP_NAME" "$ROOT_DIR/$MANIFEST_NAME" "$ROOT_DIR/SHA256SUMS.txt"
          mkdir -p "$PKG_DIR"

          cp "$SO_PATH" "$PKG_DIR/libvulkan_panfrost.so"

          cat <<EOF > "$PKG_DIR/meta.json"
          {
            "schemaVersion": 1,
            "name": "PanVK G52 (${FLAVOR})",
            "description": "PanVK Mali-G52 (kbase) Vulkan driver (${FLAVOR})",
            "author": "PanVK / Mesa",
            "packageVersion": "${PANVK_RELEASE}",
            "vendor": "ARM Mali",
            "driverVersion": "${PANVK_RELEASE}",
            "minApi": 30,
            "libraryName": "libvulkan_panfrost.so"
          }
          EOF

          (cd "$PKG_DIR" && zip -r "$ROOT_DIR/$ZIP_NAME" libvulkan_panfrost.so meta.json)

          {
            echo "Package: ${ZIP_NAME}"
            echo "Version: ${PANVK_RELEASE}"
            echo "Flavor: ${FLAVOR}"
            echo "Mesa Ref: ${MESA_REF}"
            echo "Source SO: ${SO_PATH}"
            echo "--- Contents ---"
            unzip -l "$ROOT_DIR/$ZIP_NAME"
          } > "$ROOT_DIR/$MANIFEST_NAME"

          (cd "$ROOT_DIR" && sha256sum "$ZIP_NAME" "$MANIFEST_NAME" > SHA256SUMS.txt)

          # Meter MANIFEST y SHA256SUMS también dentro del ZIP si lo deseas
          (cd "$ROOT_DIR" && zip -j "$ZIP_NAME" "$MANIFEST_NAME" SHA256SUMS.txt)

          echo "=== Contenido final del ZIP ==="
          unzip -l "$ROOT_DIR/$ZIP_NAME"
          ls -lh "$ROOT_DIR/$ZIP_NAME" "$ROOT_DIR/$MANIFEST_NAME" "$ROOT_DIR/SHA256SUMS.txt"

      - name: Upload packaged ZIP driver
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-G52-${{ matrix.flavor }}-release
          path: |
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}.zip
            PanVK-G52-${{ env.PANVK_RELEASE }}-${{ matrix.flavor }}-MANIFEST.txt
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload raw driver binary
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-g52-aarch64-${{ matrix.flavor }}
          path: build/src/panfrost/vulkan/libvulkan_panfrost.so
          if-no-files-found: error
